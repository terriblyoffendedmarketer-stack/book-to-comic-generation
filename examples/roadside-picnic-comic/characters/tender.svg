<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <!-- TENDER — Character Sheet
       4 data-driven expressions (Ch1 Zone expedition only)
       Key identifiers: heavyset, round, balding, sweaty, nervous
       Comic relief character — panicking in the Zone -->
  <style>
    text { font-family: 'Courier New', monospace; }
    .label { font-size: 11px; font-weight: bold; text-anchor: middle; fill: #333; }
    .sublabel { font-size: 9px; text-anchor: middle; fill: #888; }
  </style>

  <defs>
    <g id="tender-body">
      <!-- Very round, heavyset torso -->
      <ellipse cx="0" cy="24" rx="24" ry="24" fill="#6a7a5a" stroke="#222" stroke-width="2"/>
      <!-- Short thick arms -->
      <line x1="-24" y1="14" x2="-30" y2="34" stroke="#222" stroke-width="5" stroke-linecap="round"/>
      <line x1="24" y1="14" x2="30" y2="34" stroke="#222" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-30" cy="36" r="5" fill="#d8b8a0" stroke="#222" stroke-width="1.2"/>
      <circle cx="30" cy="36" r="5" fill="#d8b8a0" stroke="#222" stroke-width="1.2"/>
      <!-- Short stubby legs -->
      <line x1="-10" y1="46" x2="-10" y2="66" stroke="#333" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="10" y1="46" x2="10" y2="66" stroke="#333" stroke-width="4.5" stroke-linecap="round"/>
      <ellipse cx="-12" cy="68" rx="8" ry="4" fill="#444" stroke="#222" stroke-width="1.2"/>
      <ellipse cx="12" cy="68" rx="8" ry="4" fill="#444" stroke="#222" stroke-width="1.2"/>
    </g>

    <g id="tender-head-base">
      <!-- Very round face -->
      <circle cx="0" cy="-8" r="20" fill="#d8b8a0" stroke="#222" stroke-width="2"/>
      <!-- Balding — thin wisps -->
      <path d="M-16,-18 Q-12,-24 -6,-22" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M16,-18 Q12,-24 6,-22" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Pink shiny scalp -->
      <ellipse cx="0" cy="-22" rx="8" ry="4" fill="#e8c8b8" opacity="0.4"/>
      <!-- Double chin -->
      <path d="M-10,10 Q0,14 10,10" fill="#d0b098" stroke="#c0a088" stroke-width="1"/>
      <!-- Small nose -->
      <circle cx="0" cy="-2" r="3" fill="#c8a890" stroke="#222" stroke-width="1"/>
    </g>
  </defs>

  <text x="250" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#222" font-family="'Courier New', monospace">TENDER — 4 Expressions (Ch1 Zone expedition)</text>

  <!-- 1. SCARED/RED/PUFFING — suiting up -->
  <g id="tender-scared" transform="translate(70, 95)">
    <use href="#tender-body"/>
    <g transform="translate(0, -50)">
      <use href="#tender-head-base"/>
      <!-- Wide terrified eyes -->
      <ellipse cx="-7" cy="-8" rx="4" ry="3.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-8" rx="4" ry="3.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-8" r="2" fill="#445"/>
      <circle cx="9" cy="-8" r="2" fill="#445"/>
      <!-- High panicked brows -->
      <line x1="-12" y1="-16" x2="-4" y2="-13" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="-13" x2="12" y2="-16" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Open panting mouth -->
      <ellipse cx="0" cy="4" rx="4" ry="3" fill="#833" stroke="#222" stroke-width="1.2"/>
      <!-- Red flush -->
      <circle cx="-10" cy="-2" r="4" fill="#d88" opacity="0.3"/>
      <circle cx="10" cy="-2" r="4" fill="#d88" opacity="0.3"/>
    </g>
    <text x="0" y="88" class="label">scared</text>
    <text x="0" y="99" class="sublabel">red, puffing</text>
  </g>

  <!-- 2. SWEATING/DESPERATE — in Zone -->
  <g id="tender-desperate" transform="translate(190, 95)">
    <use href="#tender-body"/>
    <g transform="translate(0, -50)">
      <use href="#tender-head-base"/>
      <!-- Squinting desperate eyes -->
      <ellipse cx="-7" cy="-8" rx="3.5" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-8" rx="3.5" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-8" r="1.8" fill="#445"/>
      <circle cx="9" cy="-8" r="1.8" fill="#445"/>
      <!-- Strained brows -->
      <line x1="-12" y1="-14" x2="-4" y2="-12" stroke="#888" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="4" y1="-12" x2="12" y2="-14" stroke="#888" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Grimacing mouth -->
      <path d="M-5,3 Q0,5 5,3" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Heavy sweat drops -->
      <path d="M-16,-6 L-18,-2 L-14,-2 Z" fill="#6bf" opacity="0.7"/>
      <path d="M14,-14 L12,-10 L16,-10 Z" fill="#6bf" opacity="0.6"/>
      <path d="M-12,-16 L-14,-12 L-10,-12 Z" fill="#6bf" opacity="0.5"/>
    </g>
    <text x="0" y="88" class="label">desperate</text>
    <text x="0" y="99" class="sublabel">sweating buckets</text>
  </g>

  <!-- 3. BABBLING/NERVOUS — in Zone, can't shut up -->
  <g id="tender-babbling" transform="translate(310, 95)">
    <use href="#tender-body"/>
    <g transform="translate(0, -50)">
      <use href="#tender-head-base"/>
      <!-- Darting unfocused eyes -->
      <ellipse cx="-7" cy="-8" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-8" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-8" cy="-8" r="1.5" fill="#445"/>
      <circle cx="10" cy="-8" r="1.5" fill="#445"/>
      <!-- Uneven panicked brows -->
      <line x1="-12" y1="-16" x2="-4" y2="-13" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="-14" x2="12" y2="-15" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Wide babbling mouth -->
      <ellipse cx="0" cy="5" rx="5" ry="3.5" fill="#833" stroke="#222" stroke-width="1.3"/>
      <!-- Sweat -->
      <path d="M-16,-4 L-18,0 L-14,0 Z" fill="#6bf" opacity="0.6"/>
    </g>
    <text x="0" y="88" class="label">babbling</text>
    <text x="0" y="99" class="sublabel">nervous, nonstop</text>
  </g>

  <!-- 4. RELIEVED/PUFFED UP — after surviving Zone -->
  <g id="tender-relieved" transform="translate(430, 95)">
    <use href="#tender-body"/>
    <g transform="translate(0, -50)">
      <use href="#tender-head-base"/>
      <!-- Closed relieved eyes -->
      <path d="M-10,-8 Q-7,-6 -4,-8" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <path d="M6,-8 Q9,-6 12,-8" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <!-- Relaxed brows -->
      <line x1="-11" y1="-14" x2="-4" y2="-13" stroke="#888" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="5" y1="-13" x2="12" y2="-14" stroke="#888" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Satisfied smile -->
      <path d="M-5,3 Q0,8 5,3" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="88" class="label">relieved</text>
    <text x="0" y="99" class="sublabel">puffed up, survived</text>
  </g>
</svg>
