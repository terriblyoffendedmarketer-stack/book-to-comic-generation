<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <!-- DICK NOONAN — Character Sheet
       10 data-driven expressions (Ch1 appearances, Ch2 café, Ch3 POV)
       Key identifiers: plump, pink, balding, small, round face, red tie
       Secret: undercover agent — jovial exterior, complex interior -->
  <style>
    text { font-family: 'Courier New', monospace; }
    .label { font-size: 11px; font-weight: bold; text-anchor: middle; fill: #333; }
    .sublabel { font-size: 9px; text-anchor: middle; fill: #888; }
  </style>

  <defs>
    <g id="noonan-body">
      <!-- Wider/rounder torso — plump -->
      <ellipse cx="0" cy="28" rx="28" ry="26" fill="#445577" stroke="#222" stroke-width="2"/>
      <!-- White shirt collar -->
      <path d="M-10,-2 L0,6 L10,-2" fill="white" stroke="#222" stroke-width="1.5"/>
      <!-- Red tie -->
      <path d="M0,6 L-3,20 L0,24 L3,20 Z" fill="#c44" stroke="#a33" stroke-width="1"/>
      <!-- Arms — shorter, plumper -->
      <line x1="-28" y1="14" x2="-34" y2="40" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="28" y1="14" x2="34" y2="40" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Plump pink hands -->
      <circle cx="-34" cy="42" r="5" fill="#f0b8a8" stroke="#222" stroke-width="1.5"/>
      <circle cx="34" cy="42" r="5" fill="#f0b8a8" stroke="#222" stroke-width="1.5"/>
      <!-- Shorter legs -->
      <line x1="-10" y1="52" x2="-10" y2="76" stroke="#333" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="52" x2="10" y2="76" stroke="#333" stroke-width="4" stroke-linecap="round"/>
      <!-- Shoes -->
      <ellipse cx="-12" cy="79" rx="9" ry="4.5" fill="#333" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="12" cy="79" rx="9" ry="4.5" fill="#333" stroke="#222" stroke-width="1.5"/>
    </g>

    <g id="noonan-head-base">
      <!-- Rounder, pinker face -->
      <circle cx="0" cy="-8" r="22" fill="#f0c0b0" stroke="#222" stroke-width="2"/>
      <!-- Balding — thin hair on sides, bald top -->
      <path d="M-20,-12 Q-22,-18 -18,-22 Q-10,-24 -5,-22" fill="#a88" stroke="#876" stroke-width="1.2"/>
      <path d="M20,-12 Q22,-18 18,-22 Q10,-24 5,-22" fill="#a88" stroke="#876" stroke-width="1.2"/>
      <!-- Pink scalp shine -->
      <ellipse cx="0" cy="-22" rx="8" ry="4" fill="#f5ccc0" opacity="0.4"/>
      <!-- Small round nose -->
      <circle cx="0" cy="-2" r="3.5" fill="#e8a898" stroke="#222" stroke-width="1.2"/>
    </g>
  </defs>

  <text x="450" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#222" font-family="'Courier New', monospace">DICK NOONAN — 10 Expressions (Secret Agent, Ch1-3)</text>

  <!-- ROW 1: 5 expressions -->

  <!-- 1. HEARTY/JOVIAL — default persona, greeting everyone -->
  <g id="noonan-jovial" transform="translate(80, 100)">
    <use href="#noonan-body"/>
    <g transform="translate(0, -55)">
      <use href="#noonan-head-base"/>
      <!-- Small cheerful eyes -->
      <path d="M-10,-10 Q-6,-7 -2,-10" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M4,-10 Q8,-7 12,-10" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Raised happy brows -->
      <path d="M-11,-15 Q-7,-18 -2,-14" fill="none" stroke="#a88" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M4,-14 Q9,-18 13,-15" fill="none" stroke="#a88" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Big warm smile -->
      <path d="M-8,2 Q0,10 8,2" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <!-- Rosy cheeks -->
      <circle cx="-12" cy="-2" r="4" fill="#e8a090" opacity="0.3"/>
      <circle cx="12" cy="-2" r="4" fill="#e8a090" opacity="0.3"/>
    </g>
    <text x="0" y="98" class="label">jovial</text>
    <text x="0" y="109" class="sublabel">hearty, beaming</text>
  </g>

  <!-- 2. SYMPATHETIC/CONCERNED — news about Kirill, about Monkey -->
  <g id="noonan-sympathetic" transform="translate(240, 100)">
    <use href="#noonan-body"/>
    <g transform="translate(0, -55)">
      <use href="#noonan-head-base"/>
      <!-- Soft worried eyes -->
      <ellipse cx="-6" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10" r="1.8" fill="#556"/>
      <circle cx="8" cy="-10" r="1.8" fill="#556"/>
      <!-- Tilted-up inner brows (sympathy) -->
      <line x1="-11" y1="-14" x2="-3" y2="-17" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-17" x2="13" y2="-14" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Slight sad smile -->
      <path d="M-5,2 Q1,5 7,2" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="98" class="label">sympathetic</text>
    <text x="0" y="109" class="sublabel">concerned, gentle</text>
  </g>

  <!-- 3. BUSTLING/ENERGETIC — at café, everywhere -->
  <g id="noonan-bustling" transform="translate(400, 100)">
    <use href="#noonan-body"/>
    <g transform="translate(0, -55)">
      <use href="#noonan-head-base"/>
      <!-- Bright small eyes -->
      <circle cx="-6" cy="-10" r="2" fill="#222"/>
      <circle cx="8" cy="-10" r="2" fill="#222"/>
      <!-- Raised animated brows -->
      <line x1="-11" y1="-17" x2="-2" y2="-15" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="-15" x2="13" y2="-17" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Open talking mouth -->
      <ellipse cx="0" cy="4" rx="5" ry="3.5" fill="#833" stroke="#222" stroke-width="1.5"/>
    </g>
    <text x="0" y="98" class="label">bustling</text>
    <text x="0" y="109" class="sublabel">energetic, talking</text>
  </g>

  <!-- 4. SWEATING/NERVOUS — Lemchen meeting -->
  <g id="noonan-nervous" transform="translate(560, 100)">
    <use href="#noonan-body"/>
    <g transform="translate(0, -55)">
      <use href="#noonan-head-base"/>
      <!-- Worried wide eyes -->
      <ellipse cx="-6" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10" r="1.8" fill="#556"/>
      <circle cx="8" cy="-10" r="1.8" fill="#556"/>
      <!-- Strained upward brows -->
      <line x1="-11" y1="-17" x2="-3" y2="-14" stroke="#a88" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="5" y1="-14" x2="13" y2="-17" stroke="#a88" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Tight anxious mouth -->
      <path d="M-5,3 Q0,5 5,3" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Sweat -->
      <path d="M-18,-8 L-20,-4 L-16,-4 Z" fill="#6bf" opacity="0.6"/>
      <path d="M16,-15 L14,-11 L18,-11 Z" fill="#6bf" opacity="0.5"/>
    </g>
    <text x="0" y="98" class="label">nervous</text>
    <text x="0" y="109" class="sublabel">sweating, anxious</text>
  </g>

  <!-- 5. ANGRY/VIOLENT — beating Mosul -->
  <g id="noonan-angry" transform="translate(720, 100)">
    <use href="#noonan-body"/>
    <g transform="translate(0, -55)">
      <use href="#noonan-head-base"/>
      <!-- Glaring eyes -->
      <ellipse cx="-6" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-5" cy="-10" r="2" fill="#222"/>
      <circle cx="9" cy="-10" r="2" fill="#222"/>
      <!-- Hard V brows -->
      <line x1="-12" y1="-17" x2="-3" y2="-13" stroke="#a88" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="-13" x2="14" y2="-17" stroke="#a88" stroke-width="2" stroke-linecap="round"/>
      <!-- Snarling mouth -->
      <path d="M-6,1 Q0,5 8,1" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <!-- Red face (angrier pink) -->
      <circle cx="-12" cy="-2" r="5" fill="#d88" opacity="0.3"/>
      <circle cx="12" cy="-2" r="5" fill="#d88" opacity="0.3"/>
    </g>
    <text x="0" y="98" class="label">angry</text>
    <text x="0" y="109" class="sublabel">violent, flushed</text>
  </g>

  <!-- ROW 2: 5 expressions -->

  <!-- 6. GENIAL/PLAYFUL — with Pilman at Borscht -->
  <g id="noonan-genial" transform="translate(80, 270)">
    <use href="#noonan-body"/>
    <g transform="translate(0, -55)">
      <use href="#noonan-head-base"/>
      <!-- Twinkling crinkled eyes -->
      <path d="M-10,-10 Q-6,-7 -2,-10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <path d="M4,-10 Q8,-7 12,-10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-6" cy="-9" r="1" fill="#222"/>
      <circle cx="8" cy="-9" r="1" fill="#222"/>
      <!-- Relaxed brows -->
      <line x1="-11" y1="-16" x2="-3" y2="-14" stroke="#a88" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="5" y1="-14" x2="13" y2="-16" stroke="#a88" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Warm smile -->
      <path d="M-7,2 Q0,8 7,2" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="0" y="98" class="label">genial</text>
    <text x="0" y="109" class="sublabel">playful, twinkling</text>
  </g>

  <!-- 7. HEARTBROKEN — seeing Monkey's deterioration -->
  <g id="noonan-heartbroken" transform="translate(240, 270)">
    <use href="#noonan-body"/>
    <g transform="translate(0, -55)">
      <use href="#noonan-head-base"/>
      <!-- Stricken eyes, moist -->
      <ellipse cx="-6" cy="-10" rx="3" ry="2.8" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3" ry="2.8" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10" r="1.8" fill="#556"/>
      <circle cx="8" cy="-10" r="1.8" fill="#556"/>
      <circle cx="-4" cy="-11" r="0.6" fill="white"/>
      <circle cx="10" cy="-11" r="0.6" fill="white"/>
      <!-- Up-tilted inner brows (pain) -->
      <line x1="-11" y1="-13" x2="-3" y2="-17" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-17" x2="13" y2="-13" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Tight trembling mouth -->
      <path d="M-5,3 Q-2,4 0,3 Q2,2 5,3" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="98" class="label">heartbroken</text>
    <text x="0" y="109" class="sublabel">throat dry, stricken</text>
  </g>

  <!-- 8. SELF-LOATHING/CONFLICTED — realizing why he befriended Guta -->
  <g id="noonan-conflicted" transform="translate(400, 270)">
    <use href="#noonan-body"/>
    <g transform="translate(0, -55)">
      <use href="#noonan-head-base"/>
      <!-- Downcast averted eyes -->
      <ellipse cx="-6" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-9" r="1.5" fill="#556"/>
      <circle cx="7" cy="-9" r="1.5" fill="#556"/>
      <!-- Furrowed troubled brows -->
      <line x1="-11" y1="-14" x2="-3" y2="-15" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-15" x2="13" y2="-14" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Grimace -->
      <path d="M-5,3 Q0,1 5,3" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="0" y="98" class="label">conflicted</text>
    <text x="0" y="109" class="sublabel">self-loathing, averted</text>
  </g>

  <!-- 9. DESPAIRING — "we won't be able to do a thing!" -->
  <g id="noonan-despairing" transform="translate(560, 270)">
    <use href="#noonan-body"/>
    <g transform="translate(0, -55)">
      <use href="#noonan-head-base"/>
      <!-- Wide hollow eyes -->
      <ellipse cx="-6" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10" r="1.5" fill="#556"/>
      <circle cx="8" cy="-10" r="1.5" fill="#556"/>
      <!-- Raised helpless brows -->
      <line x1="-11" y1="-18" x2="-3" y2="-15" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-15" x2="13" y2="-18" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Open defeated mouth -->
      <ellipse cx="0" cy="4" rx="4" ry="3" fill="#833" stroke="#222" stroke-width="1.3"/>
    </g>
    <text x="0" y="98" class="label">despairing</text>
    <text x="0" y="109" class="sublabel">hollow, helpless</text>
  </g>

  <!-- 10. FAKE SURPRISE — performing innocence with Red -->
  <g id="noonan-fake-surprise" transform="translate(720, 270)">
    <use href="#noonan-body"/>
    <g transform="translate(0, -55)">
      <use href="#noonan-head-base"/>
      <!-- Wide "innocent" eyes -->
      <ellipse cx="-6" cy="-10" rx="4" ry="3.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="4" ry="3.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10" r="2" fill="#556"/>
      <circle cx="8" cy="-10" r="2" fill="#556"/>
      <!-- Very high arched brows -->
      <path d="M-12,-17 Q-7,-21 -2,-16" fill="none" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M4,-16 Q9,-21 14,-17" fill="none" stroke="#a88" stroke-width="1.5" stroke-linecap="round"/>
      <!-- O-shaped mouth -->
      <ellipse cx="0" cy="3" rx="4" ry="3.5" fill="#833" stroke="#222" stroke-width="1.5"/>
      <!-- One finger raised (to pursed lips gesture) -->
    </g>
    <text x="0" y="98" class="label">fake surprise</text>
    <text x="0" y="109" class="sublabel">performing, wide-eyed</text>
  </g>
</svg>
