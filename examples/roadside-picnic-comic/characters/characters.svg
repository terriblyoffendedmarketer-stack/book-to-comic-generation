<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <style>
    text { font-family: 'Comic Sans MS', cursive, sans-serif; }
    .label { font-size: 14px; font-weight: bold; text-anchor: middle; }
    .desc { font-size: 10px; text-anchor: middle; fill: #666; }
  </style>

  <!-- RED SCHUHART - stocky, red hair, square jaw, tough -->
  <g id="red-front" transform="translate(100, 100)">
    <!-- Body -->
    <rect x="15" y="55" width="50" height="60" rx="5" fill="#3a5a3a" stroke="#222" stroke-width="2"/>
    <!-- Arms -->
    <line x1="15" y1="70" x2="-5" y2="95" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="70" x2="85" y2="95" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="-5" cy="97" r="5" fill="#e8b88a" stroke="#222" stroke-width="1.5"/>
    <circle cx="85" cy="97" r="5" fill="#e8b88a" stroke="#222" stroke-width="1.5"/>
    <!-- Legs -->
    <line x1="30" y1="115" x2="25" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="115" x2="55" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <!-- Boots -->
    <ellipse cx="22" cy="153" rx="10" ry="5" fill="#333" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="58" cy="153" rx="10" ry="5" fill="#333" stroke="#222" stroke-width="1.5"/>
    <!-- Head -->
    <circle cx="40" cy="30" r="25" fill="#e8b88a" stroke="#222" stroke-width="2"/>
    <!-- Red messy hair -->
    <path d="M15,22 Q20,5 30,8 Q35,2 42,6 Q50,0 55,8 Q62,5 65,20" fill="#c44" stroke="#a33" stroke-width="1.5"/>
    <!-- Eyes - tough squint -->
    <line x1="30" y1="28" x2="38" y2="28" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="28" x2="52" y2="28" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pupils -->
    <circle cx="34" cy="28" r="1.5" fill="#222"/>
    <circle cx="48" cy="28" r="1.5" fill="#222"/>
    <!-- Nose -->
    <path d="M38,30 L40,36 L43,36" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Mouth - slight smirk -->
    <path d="M33,40 Q40,45 50,40" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Stubble dots -->
    <circle cx="32" cy="43" r="0.5" fill="#999"/>
    <circle cx="36" cy="44" r="0.5" fill="#999"/>
    <circle cx="40" cy="45" r="0.5" fill="#999"/>
    <circle cx="44" cy="44" r="0.5" fill="#999"/>
    <circle cx="48" cy="43" r="0.5" fill="#999"/>
    <!-- Cigarette -->
    <line x1="50" y1="41" x2="65" y2="38" stroke="#eee" stroke-width="2" stroke-linecap="round"/>
    <circle cx="66" cy="37" r="2" fill="#f80" opacity="0.8"/>
    <text x="40" y="175" class="label">RED SCHUHART</text>
    <text x="40" y="188" class="desc">23, stocky, red hair, tough</text>
  </g>

  <!-- KIRILL PANOV - thin, intellectual, glasses, earnest -->
  <g id="kirill-front" transform="translate(280, 100)">
    <!-- Body - lab coat -->
    <rect x="20" y="55" width="40" height="60" rx="3" fill="#ddd" stroke="#222" stroke-width="2"/>
    <!-- Lab coat lapels -->
    <line x1="30" y1="55" x2="35" y2="75" stroke="#222" stroke-width="1"/>
    <line x1="50" y1="55" x2="45" y2="75" stroke="#222" stroke-width="1"/>
    <!-- Arms -->
    <line x1="20" y1="70" x2="5" y2="95" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="60" y1="70" x2="75" y2="95" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="5" cy="97" r="4.5" fill="#e0c8a8" stroke="#222" stroke-width="1.5"/>
    <circle cx="75" cy="97" r="4.5" fill="#e0c8a8" stroke="#222" stroke-width="1.5"/>
    <!-- Legs -->
    <line x1="32" y1="115" x2="28" y2="150" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="48" y1="115" x2="52" y2="150" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="26" cy="153" rx="8" ry="4" fill="#555" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="54" cy="153" rx="8" ry="4" fill="#555" stroke="#222" stroke-width="1.5"/>
    <!-- Head - narrower than Red -->
    <ellipse cx="40" cy="28" rx="20" ry="23" fill="#e0c8a8" stroke="#222" stroke-width="2"/>
    <!-- Hair - neat, dark -->
    <path d="M20,20 Q25,5 35,8 Q40,4 45,8 Q55,5 60,20" fill="#443322" stroke="#332211" stroke-width="1.5"/>
    <!-- Glasses -->
    <circle cx="32" cy="26" r="7" fill="none" stroke="#444" stroke-width="1.5"/>
    <circle cx="50" cy="26" r="7" fill="none" stroke="#444" stroke-width="1.5"/>
    <line x1="39" y1="26" x2="43" y2="26" stroke="#444" stroke-width="1.5"/>
    <!-- Eyes through glasses - big, earnest -->
    <circle cx="32" cy="26" r="2" fill="#222"/>
    <circle cx="50" cy="26" r="2" fill="#222"/>
    <!-- Eyebrows - slightly worried -->
    <line x1="26" y1="18" x2="36" y2="20" stroke="#443322" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="46" y1="20" x2="56" y2="18" stroke="#443322" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M39,28 L40,34 L43,34" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Mouth - slight smile -->
    <path d="M35,38 Q40,42 47,38" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    <text x="40" y="175" class="label">KIRILL PANOV</text>
    <text x="40" y="188" class="desc">Russian scientist, earnest</text>
  </g>

  <!-- TENDER - older, heavyset, round face, nervous -->
  <g id="tender-front" transform="translate(460, 100)">
    <!-- Body - bigger -->
    <rect x="10" y="50" width="60" height="65" rx="8" fill="#5577aa" stroke="#222" stroke-width="2"/>
    <!-- Arms -->
    <line x1="10" y1="68" x2="-8" y2="95" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="68" x2="88" y2="95" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="-8" cy="97" r="6" fill="#ddb899" stroke="#222" stroke-width="1.5"/>
    <circle cx="88" cy="97" r="6" fill="#ddb899" stroke="#222" stroke-width="1.5"/>
    <!-- Legs -->
    <line x1="28" y1="115" x2="24" y2="148" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <line x1="52" y1="115" x2="56" y2="148" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <!-- Boots -->
    <ellipse cx="22" cy="151" rx="11" ry="5" fill="#443" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="58" cy="151" rx="11" ry="5" fill="#443" stroke="#222" stroke-width="1.5"/>
    <!-- Head - rounder, bigger -->
    <circle cx="40" cy="27" r="26" fill="#ddb899" stroke="#222" stroke-width="2"/>
    <!-- Balding hair -->
    <path d="M16,18 Q18,8 24,12 Q38,-2 56,12 Q62,8 64,18" fill="#887766" stroke="#776655" stroke-width="1.5"/>
    <!-- Eyes - wide, worried -->
    <ellipse cx="31" cy="26" rx="4" ry="5" fill="white" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="49" cy="26" rx="4" ry="5" fill="white" stroke="#222" stroke-width="1.5"/>
    <circle cx="31" cy="27" r="2.5" fill="#222"/>
    <circle cx="49" cy="27" r="2.5" fill="#222"/>
    <!-- Eyebrows - raised/worried -->
    <path d="M25,18 Q30,14 37,18" fill="none" stroke="#887766" stroke-width="2" stroke-linecap="round"/>
    <path d="M43,18 Q50,14 55,18" fill="none" stroke="#887766" stroke-width="2" stroke-linecap="round"/>
    <!-- Nose - broad -->
    <path d="M37,29 Q40,35 43,29" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Mouth - nervous O -->
    <ellipse cx="40" cy="40" rx="5" ry="4" fill="none" stroke="#222" stroke-width="1.5"/>
    <!-- Sweat drops -->
    <path d="M60,15 Q62,18 60,21" fill="#8cf" stroke="#6af" stroke-width="1"/>
    <text x="40" y="175" class="label">TENDER</text>
    <text x="40" y="188" class="desc">Lab assistant, older, nervous</text>
  </g>

  <!-- DICK NOONAN - small, round, pink, friendly -->
  <g id="dick-front" transform="translate(640, 115)">
    <!-- Body - round, shorter -->
    <ellipse cx="40" cy="80" rx="28" ry="30" fill="#446688" stroke="#222" stroke-width="2"/>
    <!-- Tie -->
    <polygon points="40,55 36,68 40,72 44,68" fill="#c44" stroke="#222" stroke-width="1"/>
    <!-- Arms -->
    <line x1="12" y1="75" x2="0" y2="95" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <line x1="68" y1="75" x2="80" y2="95" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="0" cy="97" r="5" fill="#f0c0b0" stroke="#222" stroke-width="1.5"/>
    <circle cx="80" cy="97" r="5" fill="#f0c0b0" stroke="#222" stroke-width="1.5"/>
    <!-- Legs - short -->
    <line x1="30" y1="108" x2="27" y2="135" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="108" x2="53" y2="135" stroke="#222" stroke-width="4" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="25" cy="138" rx="9" ry="4" fill="#333" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="55" cy="138" rx="9" ry="4" fill="#333" stroke="#222" stroke-width="1.5"/>
    <!-- Head - round, pink -->
    <circle cx="40" cy="28" r="22" fill="#f0c0b0" stroke="#222" stroke-width="2"/>
    <!-- Thinning hair -->
    <path d="M20,18 Q25,10 35,14 Q40,10 45,14 Q55,10 60,18" fill="#aa8866" stroke="#997755" stroke-width="1"/>
    <!-- Eyes - friendly, crinkled -->
    <path d="M30,26 Q34,23 38,26" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    <path d="M44,26 Q48,23 52,26" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    <circle cx="34" cy="25" r="1.5" fill="#222"/>
    <circle cx="48" cy="25" r="1.5" fill="#222"/>
    <!-- Nose - small, round -->
    <circle cx="40" cy="32" r="3" fill="#e8b0a0" stroke="#222" stroke-width="1"/>
    <!-- Mouth - friendly smile -->
    <path d="M32,38 Q40,44 48,38" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <circle cx="26" cy="34" r="4" fill="#e8a0a0" opacity="0.4"/>
    <circle cx="54" cy="34" r="4" fill="#e8a0a0" opacity="0.4"/>
    <text x="40" y="162" class="label">DICK NOONAN</text>
    <text x="40" y="175" class="desc">Small, round, pink, friendly</text>
  </g>

  <!-- GUTALIN - huge, intense, long arms -->
  <g id="gutalin-front" transform="translate(820, 80)">
    <!-- Body - massive -->
    <rect x="5" y="65" width="70" height="75" rx="5" fill="#555" stroke="#222" stroke-width="2"/>
    <!-- Arms - long, to the knees -->
    <line x1="5" y1="80" x2="-18" y2="130" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <line x1="75" y1="80" x2="98" y2="130" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <!-- Hands - big -->
    <circle cx="-18" cy="133" r="7" fill="#6b4423" stroke="#222" stroke-width="1.5"/>
    <circle cx="98" cy="133" r="7" fill="#6b4423" stroke="#222" stroke-width="1.5"/>
    <!-- Legs -->
    <line x1="25" y1="140" x2="20" y2="175" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <line x1="55" y1="140" x2="60" y2="175" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <!-- Boots -->
    <ellipse cx="18" cy="178" rx="12" ry="5" fill="#333" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="62" cy="178" rx="12" ry="5" fill="#333" stroke="#222" stroke-width="1.5"/>
    <!-- Head -->
    <circle cx="40" cy="35" r="28" fill="#6b4423" stroke="#222" stroke-width="2"/>
    <!-- Eyes - intense, white against dark skin -->
    <ellipse cx="30" cy="33" rx="5" ry="4" fill="white" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="50" cy="33" rx="5" ry="4" fill="white" stroke="#222" stroke-width="1.5"/>
    <circle cx="30" cy="33" r="2.5" fill="#222"/>
    <circle cx="50" cy="33" r="2.5" fill="#222"/>
    <!-- Heavy brow -->
    <path d="M22,26 L38,28" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <path d="M42,28 L58,26" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M37,36 Q40,42 43,36" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    <!-- Mouth - stern -->
    <line x1="30" y1="48" x2="50" y2="48" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Short hair -->
    <path d="M12,22 Q15,10 25,12 Q35,5 45,12 Q55,10 60,15 Q68,20 68,28" fill="#4a2f13" stroke="#3a1f03" stroke-width="1"/>
    <text x="40" y="200" class="label">GUTALIN</text>
    <text x="40" y="213" class="desc">Huge, intense, religious</text>
  </g>

  <!-- ERNEST - bartender -->
  <g id="ernest-front" transform="translate(1000, 110)">
    <!-- Body with apron -->
    <rect x="15" y="55" width="50" height="55" rx="3" fill="#446" stroke="#222" stroke-width="2"/>
    <!-- Apron -->
    <rect x="20" y="60" width="40" height="50" rx="2" fill="#ddd" stroke="#222" stroke-width="1"/>
    <!-- Arms - one holding glass -->
    <line x1="15" y1="70" x2="0" y2="90" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="65" y1="70" x2="80" y2="85" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Glass in hand -->
    <path d="M75,75 L85,75 L83,90 L77,90 Z" fill="none" stroke="#88c" stroke-width="1.5"/>
    <!-- Hands -->
    <circle cx="0" cy="92" r="4.5" fill="#ddb899" stroke="#222" stroke-width="1.5"/>
    <circle cx="80" cy="87" r="4.5" fill="#ddb899" stroke="#222" stroke-width="1.5"/>
    <!-- Legs -->
    <line x1="30" y1="110" x2="28" y2="140" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="110" x2="52" y2="140" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="26" cy="143" rx="9" ry="4" fill="#333" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="54" cy="143" rx="9" ry="4" fill="#333" stroke="#222" stroke-width="1.5"/>
    <!-- Head -->
    <circle cx="40" cy="28" r="22" fill="#ddb899" stroke="#222" stroke-width="2"/>
    <!-- Mustache -->
    <path d="M30,36 Q35,40 40,36 Q45,40 50,36" fill="#554" stroke="#443" stroke-width="1.5"/>
    <!-- Eyes - shrewd -->
    <line x1="30" y1="25" x2="37" y2="25" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    <line x1="43" y1="25" x2="50" y2="25" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    <circle cx="34" cy="25" r="1.5" fill="#222"/>
    <circle cx="46" cy="25" r="1.5" fill="#222"/>
    <!-- Hair - receding -->
    <path d="M18,18 Q22,8 32,12 Q40,6 48,12 Q58,8 62,18" fill="#554433" stroke="#443322" stroke-width="1"/>
    <!-- Nose -->
    <path d="M38,28 L40,33 L42,33" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    <text x="40" y="165" class="label">ERNEST</text>
    <text x="40" y="178" class="desc">Bartender, shrewd fence</text>
  </g>
</svg>