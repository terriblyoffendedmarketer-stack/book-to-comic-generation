<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <!-- GUTA SCHUHART — Character Sheet
       8 data-driven expressions (Ch1 end, Ch2 home, Ch3 kitchen)
       Key identifiers: beautiful, long dark hair, long neck, proud bearing
       Later: strained, thinner, feverish eyes
       Wears: blue house dress, low-cut -->
  <style>
    text { font-family: 'Courier New', monospace; }
    .label { font-size: 11px; font-weight: bold; text-anchor: middle; fill: #333; }
    .sublabel { font-size: 9px; text-anchor: middle; fill: #888; }
  </style>

  <defs>
    <g id="guta-body">
      <!-- Slim, proud posture — slightly narrower than Red -->
      <path d="M-16,-4 Q-20,10 -18,30 Q-16,44 -14,52 L14,52 Q16,44 18,30 Q20,10 16,-4 Z"
            fill="#4a6a8a" stroke="#222" stroke-width="2"/>
      <!-- Low V-neckline showing collarbone -->
      <path d="M-10,-6 L0,8 L10,-6" fill="#e8c0a8" stroke="#222" stroke-width="1.5"/>
      <!-- Slim arms -->
      <line x1="-20" y1="6" x2="-26" y2="38" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="20" y1="6" x2="26" y2="38" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Delicate hands -->
      <circle cx="-26" cy="40" r="4" fill="#e8c0a8" stroke="#222" stroke-width="1.2"/>
      <circle cx="26" cy="40" r="4" fill="#e8c0a8" stroke="#222" stroke-width="1.2"/>
      <!-- Slim legs -->
      <line x1="-8" y1="52" x2="-8" y2="76" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="52" x2="8" y2="76" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <!-- Simple shoes -->
      <ellipse cx="-10" cy="78" rx="7" ry="3.5" fill="#555" stroke="#222" stroke-width="1.2"/>
      <ellipse cx="10" cy="78" rx="7" ry="3.5" fill="#555" stroke="#222" stroke-width="1.2"/>
    </g>

    <g id="guta-head-base">
      <!-- Oval face, slightly longer/elegant -->
      <ellipse cx="0" cy="-8" rx="18" ry="22" fill="#e8c0a8" stroke="#222" stroke-width="2"/>
      <!-- Long neck (key identifier) -->
      <rect x="-6" y="12" width="12" height="10" fill="#e8c0a8" stroke="none"/>
      <line x1="-6" y1="12" x2="-6" y2="22" stroke="#222" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="6" y2="22" stroke="#222" stroke-width="1.5"/>
      <!-- Long dark hair — flowing past shoulders -->
      <path d="M-20,-20 Q-24,-10 -26,5 Q-28,20 -22,30 L-18,10 Q-18,-5 -16,-15 Z"
            fill="#1a1a2a" stroke="#111" stroke-width="1.5"/>
      <path d="M20,-20 Q24,-10 26,5 Q28,20 22,30 L18,10 Q18,-5 16,-15 Z"
            fill="#1a1a2a" stroke="#111" stroke-width="1.5"/>
      <!-- Hair top -->
      <path d="M-16,-26 Q-8,-32 0,-30 Q8,-32 16,-26 Q18,-18 16,-15 L-16,-15 Q-18,-18 -16,-26 Z"
            fill="#1a1a2a" stroke="#111" stroke-width="1.5"/>
      <!-- Small elegant nose -->
      <path d="M0,-4 L-2,2 Q0,3 2,2 Z" fill="#d8b098" stroke="#222" stroke-width="0.8"/>
      <!-- Defined lips (key feature — beauty) -->
      <path d="M-5,6 Q-2,4 0,5 Q2,4 5,6" fill="none" stroke="#b66" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <text x="450" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#222" font-family="'Courier New', monospace">GUTA SCHUHART — 8 Expressions (Ch1, Ch2, Ch3)</text>

  <!-- ROW 1: 4 expressions -->

  <!-- 1. WORRIED/STOIC — "What will happen to us now?" -->
  <g id="guta-worried" transform="translate(100, 100)">
    <use href="#guta-body"/>
    <g transform="translate(0, -60)">
      <use href="#guta-head-base"/>
      <!-- Steady but worried eyes -->
      <ellipse cx="-6" cy="-10" rx="3" ry="2.8" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3" ry="2.8" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10" r="1.8" fill="#3a2a1a"/>
      <circle cx="8" cy="-10" r="1.8" fill="#3a2a1a"/>
      <!-- Slightly drawn brows -->
      <line x1="-10" y1="-15" x2="-3" y2="-16" stroke="#1a1a2a" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="5" y1="-16" x2="12" y2="-15" stroke="#1a1a2a" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Tight pressed lips -->
      <line x1="-4" y1="7" x2="4" y2="7" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="98" class="label">worried</text>
    <text x="0" y="109" class="sublabel">stoic, "what now?"</text>
  </g>

  <!-- 2. TENDER — with Red -->
  <g id="guta-tender" transform="translate(300, 100)">
    <use href="#guta-body"/>
    <g transform="translate(0, -60)">
      <use href="#guta-head-base"/>
      <!-- Soft warm eyes -->
      <path d="M-10,-10 Q-6,-7 -2,-10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <path d="M4,-10 Q8,-7 12,-10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-6" cy="-9" r="1" fill="#3a2a1a"/>
      <circle cx="8" cy="-9" r="1" fill="#3a2a1a"/>
      <!-- Relaxed brows -->
      <path d="M-10,-14 Q-6,-16 -2,-14" fill="none" stroke="#1a1a2a" stroke-width="1" stroke-linecap="round"/>
      <path d="M4,-14 Q8,-16 12,-14" fill="none" stroke="#1a1a2a" stroke-width="1" stroke-linecap="round"/>
      <!-- Gentle smile -->
      <path d="M-4,6 Q0,10 4,6" fill="none" stroke="#b66" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="98" class="label">tender</text>
    <text x="0" y="109" class="sublabel">loving, warm</text>
  </g>

  <!-- 3. RELIEVED/HUGGING — Red comes home (Ch2) -->
  <g id="guta-relieved" transform="translate(500, 100)">
    <use href="#guta-body"/>
    <g transform="translate(0, -60)">
      <use href="#guta-head-base"/>
      <!-- Closed relieved eyes -->
      <path d="M-9,-10 Q-6,-8 -3,-10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <path d="M5,-10 Q8,-8 11,-10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <!-- Relaxed brows -->
      <line x1="-10" y1="-14" x2="-3" y2="-14" stroke="#1a1a2a" stroke-width="1" stroke-linecap="round"/>
      <line x1="5" y1="-14" x2="12" y2="-14" stroke="#1a1a2a" stroke-width="1" stroke-linecap="round"/>
      <!-- Open relieved smile -->
      <path d="M-5,5 Q0,11 5,5" fill="none" stroke="#b66" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Single tear of relief -->
      <path d="M-10,-8 L-11,-4" stroke="#6bf" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    </g>
    <text x="0" y="98" class="label">relieved</text>
    <text x="0" y="109" class="sublabel">hugging, tears</text>
  </g>

  <!-- 4. BOSSY/PLAYFUL — kitchen banter "you're just an empty bag" -->
  <g id="guta-playful" transform="translate(700, 100)">
    <use href="#guta-body"/>
    <g transform="translate(0, -60)">
      <use href="#guta-head-base"/>
      <!-- Sharp amused eyes -->
      <ellipse cx="-6" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-5" cy="-10" r="1.8" fill="#3a2a1a"/>
      <circle cx="9" cy="-10" r="1.8" fill="#3a2a1a"/>
      <!-- One raised brow (sass) -->
      <line x1="-10" y1="-16" x2="-3" y2="-14" stroke="#1a1a2a" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M5,-15 Q8,-18 12,-15" fill="none" stroke="#1a1a2a" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Smirk -->
      <path d="M-3,6 Q2,10 6,7" fill="none" stroke="#b66" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="98" class="label">playful</text>
    <text x="0" y="109" class="sublabel">bossy, smirking</text>
  </g>

  <!-- ROW 2: 4 expressions -->

  <!-- 5. ANXIOUS/PROTECTIVE — about neighbors, about Monkey -->
  <g id="guta-anxious" transform="translate(100, 270)">
    <use href="#guta-body"/>
    <g transform="translate(0, -60)">
      <use href="#guta-head-base"/>
      <!-- Wide darting eyes -->
      <ellipse cx="-6" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-10" r="1.8" fill="#3a2a1a"/>
      <circle cx="7" cy="-10" r="1.8" fill="#3a2a1a"/>
      <!-- Pinched inner brows -->
      <line x1="-10" y1="-16" x2="-4" y2="-14" stroke="#1a1a2a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="6" y1="-14" x2="12" y2="-16" stroke="#1a1a2a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Tight mouth -->
      <path d="M-4,6 Q0,7 4,6" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="98" class="label">anxious</text>
    <text x="0" y="109" class="sublabel">protective, darting</text>
  </g>

  <!-- 6. STRAINED/TREMBLING — telling Noonan about Monkey (Ch3) -->
  <g id="guta-strained" transform="translate(300, 270)">
    <use href="#guta-body"/>
    <g transform="translate(0, -60)">
      <use href="#guta-head-base"/>
      <!-- Feverish eyes (thinner face implied by darker circles) -->
      <ellipse cx="-6" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10" r="1.5" fill="#3a2a1a"/>
      <circle cx="8" cy="-10" r="1.5" fill="#3a2a1a"/>
      <!-- Dark circles (exhaustion) -->
      <path d="M-9,-8 Q-6,-6 -3,-8" fill="none" stroke="#a88" stroke-width="1" opacity="0.5"/>
      <path d="M5,-8 Q8,-6 11,-8" fill="none" stroke="#a88" stroke-width="1" opacity="0.5"/>
      <!-- Drawn tight brows -->
      <line x1="-10" y1="-15" x2="-3" y2="-14" stroke="#1a1a2a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-14" x2="12" y2="-15" stroke="#1a1a2a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Trembling lips (wavy line) -->
      <path d="M-5,6 Q-3,7 -1,6 Q1,5 3,6 Q5,7 5,6" fill="none" stroke="#222" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <text x="0" y="98" class="label">strained</text>
    <text x="0" y="109" class="sublabel">trembling, feverish</text>
  </g>

  <!-- 7. EMPTY/DEVASTATED — "she's no longer human" -->
  <g id="guta-devastated" transform="translate(500, 270)">
    <use href="#guta-body"/>
    <g transform="translate(0, -60)">
      <use href="#guta-head-base"/>
      <!-- Empty staring eyes — larger, vacant -->
      <ellipse cx="-6" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10" r="1.2" fill="#3a2a1a"/>
      <circle cx="8" cy="-10" r="1.2" fill="#3a2a1a"/>
      <!-- Flat lifeless brows -->
      <line x1="-10" y1="-15" x2="-3" y2="-15" stroke="#1a1a2a" stroke-width="1" stroke-linecap="round"/>
      <line x1="5" y1="-15" x2="12" y2="-15" stroke="#1a1a2a" stroke-width="1" stroke-linecap="round"/>
      <!-- Mouth half-open (from text: "mouth half-open, eyes empty") -->
      <ellipse cx="0" cy="7" rx="3" ry="2" fill="#944" stroke="#222" stroke-width="1.2"/>
    </g>
    <text x="0" y="98" class="label">devastated</text>
    <text x="0" y="109" class="sublabel">empty, half-open mouth</text>
  </g>

  <!-- 8. DEFIANT/BITTER — "Why? We're not the worst people" -->
  <g id="guta-defiant" transform="translate(700, 270)">
    <use href="#guta-body"/>
    <g transform="translate(0, -60)">
      <use href="#guta-head-base"/>
      <!-- Hard defiant eyes -->
      <ellipse cx="-6" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10" r="2" fill="#3a2a1a"/>
      <circle cx="8" cy="-10" r="2" fill="#3a2a1a"/>
      <!-- Slightly V'd brows (anger) -->
      <line x1="-10" y1="-16" x2="-3" y2="-14" stroke="#1a1a2a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-14" x2="12" y2="-16" stroke="#1a1a2a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Set jaw, bitter mouth -->
      <path d="M-5,6 Q0,4 5,6" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Jaw tension lines -->
      <line x1="-14" y1="4" x2="-12" y2="6" stroke="#d8b098" stroke-width="1" opacity="0.6"/>
      <line x1="14" y1="4" x2="12" y2="6" stroke="#d8b098" stroke-width="1" opacity="0.6"/>
    </g>
    <text x="0" y="98" class="label">defiant</text>
    <text x="0" y="109" class="sublabel">bitter, jaw set</text>
  </g>
</svg>
