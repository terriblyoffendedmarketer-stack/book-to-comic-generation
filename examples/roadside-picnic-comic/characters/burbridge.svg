<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
  <!-- BURBRIDGE / BUZZARD — Character Sheet
       5 data-driven expressions (Ch2 cemetery, Ch4 memories)
       Key identifiers: bald, stubbled, "yellow eyes with black dots", legless (witches' jelly)
       On crutches/prosthetics after Ch2. Calculating, wheedling voice. -->
  <style>
    text { font-family: 'Courier New', monospace; }
    .label { font-size: 11px; font-weight: bold; text-anchor: middle; fill: #333; }
    .sublabel { font-size: 9px; text-anchor: middle; fill: #888; }
  </style>

  <defs>
    <g id="burbridge-body">
      <!-- Stocky upper body — strong from crutches -->
      <rect x="-18" y="-2" width="36" height="40" rx="5" fill="#5a5040" stroke="#222" stroke-width="2"/>
      <!-- Worn leather vest -->
      <path d="M-12,-2 L-12,20" stroke="#444" stroke-width="1.5"/>
      <path d="M12,-2 L12,20" stroke="#444" stroke-width="1.5"/>
      <!-- Strong arms (from crutch use) -->
      <line x1="-18" y1="8" x2="-28" y2="30" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="18" y1="8" x2="28" y2="30" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Hands gripping crutch tops -->
      <circle cx="-28" cy="32" r="4.5" fill="#c8a880" stroke="#222" stroke-width="1.2"/>
      <circle cx="28" cy="32" r="4.5" fill="#c8a880" stroke="#222" stroke-width="1.2"/>
      <!-- Crutches -->
      <line x1="-28" y1="32" x2="-22" y2="76" stroke="#8a7a60" stroke-width="3" stroke-linecap="round"/>
      <line x1="28" y1="32" x2="22" y2="76" stroke="#8a7a60" stroke-width="3" stroke-linecap="round"/>
      <!-- Legs end at stumps — wrapped -->
      <rect x="-12" y="38" width="10" height="14" rx="3" fill="#888" stroke="#222" stroke-width="1.5"/>
      <rect x="2" y="38" width="10" height="14" rx="3" fill="#888" stroke="#222" stroke-width="1.5"/>
      <!-- Wrap lines -->
      <line x1="-12" y1="42" x2="-2" y2="42" stroke="#999" stroke-width="1"/>
      <line x1="-12" y1="46" x2="-2" y2="46" stroke="#999" stroke-width="1"/>
      <line x1="2" y1="42" x2="12" y2="42" stroke="#999" stroke-width="1"/>
      <line x1="2" y1="46" x2="12" y2="46" stroke="#999" stroke-width="1"/>
    </g>

    <g id="burbridge-head-base">
      <!-- Angular face — cunning -->
      <path d="M-16,-24 Q-18,-8 -14,6 Q-8,14 0,16 Q8,14 14,6 Q18,-8 16,-24 Z"
            fill="#c8a880" stroke="#222" stroke-width="2"/>
      <!-- Completely bald — shiny scalp -->
      <ellipse cx="0" cy="-22" rx="10" ry="5" fill="#d0b890" opacity="0.3"/>
      <!-- Stubble (key identifier) -->
      <path d="M-10,4 Q-6,8 0,10 Q6,8 10,4" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="1,2"/>
      <!-- Sharp angular nose -->
      <path d="M0,-6 L-3,2 L0,3 L3,2 Z" fill="#b89870" stroke="#222" stroke-width="0.8"/>
    </g>
  </defs>

  <text x="300" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#222" font-family="'Courier New', monospace">BURBRIDGE "BUZZARD" — 5 Expressions (Ch2, Ch4)</text>

  <!-- 1. DESPERATE/WHEEDLING — begging Red to save him -->
  <g id="burbridge-desperate" transform="translate(60, 95)">
    <use href="#burbridge-body"/>
    <g transform="translate(0, -52)">
      <use href="#burbridge-head-base"/>
      <!-- Yellow pleading eyes (KEY: yellow eyes with black dots) -->
      <ellipse cx="-7" cy="-10" rx="4" ry="3.5" fill="#e8d060" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-10" rx="4" ry="3.5" fill="#e8d060" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-10" r="1.5" fill="#111"/>
      <circle cx="9" cy="-10" r="1.5" fill="#111"/>
      <!-- Raised begging brows -->
      <line x1="-12" y1="-18" x2="-4" y2="-15" stroke="#8a7a60" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="-15" x2="12" y2="-18" stroke="#8a7a60" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Open begging mouth -->
      <ellipse cx="0" cy="7" rx="5" ry="3" fill="#833" stroke="#222" stroke-width="1.3"/>
    </g>
    <text x="0" y="95" class="label">desperate</text>
    <text x="0" y="106" class="sublabel">wheedling, begging</text>
  </g>

  <!-- 2. MANIPULATIVE/PROMISING — Golden Ball promises -->
  <g id="burbridge-manipulative" transform="translate(180, 95)">
    <use href="#burbridge-body"/>
    <g transform="translate(0, -52)">
      <use href="#burbridge-head-base"/>
      <!-- Calculating narrow eyes -->
      <ellipse cx="-7" cy="-10" rx="3.5" ry="2" fill="#e8d060" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-10" rx="3.5" ry="2" fill="#e8d060" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-10" r="1.5" fill="#111"/>
      <circle cx="9" cy="-10" r="1.5" fill="#111"/>
      <!-- One raised conniving brow -->
      <path d="M-12,-16 Q-8,-18 -4,-15" fill="none" stroke="#8a7a60" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="4" y1="-15" x2="12" y2="-14" stroke="#8a7a60" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Sly smile -->
      <path d="M-4,6 Q0,10 6,7" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="95" class="label">manipulative</text>
    <text x="0" y="106" class="sublabel">promising, sly</text>
  </g>

  <!-- 3. STUBBORN — refusing to give up -->
  <g id="burbridge-stubborn" transform="translate(300, 95)">
    <use href="#burbridge-body"/>
    <g transform="translate(0, -52)">
      <use href="#burbridge-head-base"/>
      <!-- Set determined eyes -->
      <ellipse cx="-7" cy="-10" rx="3" ry="2.5" fill="#e8d060" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-10" rx="3" ry="2.5" fill="#e8d060" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-10" r="1.8" fill="#111"/>
      <circle cx="9" cy="-10" r="1.8" fill="#111"/>
      <!-- Heavy flat brows -->
      <line x1="-12" y1="-15" x2="-4" y2="-15" stroke="#8a7a60" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="-15" x2="12" y2="-15" stroke="#8a7a60" stroke-width="2" stroke-linecap="round"/>
      <!-- Clenched jaw -->
      <line x1="-5" y1="7" x2="5" y2="7" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="0" y="95" class="label">stubborn</text>
    <text x="0" y="106" class="sublabel">refusing, set jaw</text>
  </g>

  <!-- 4. THREATENING — "You tried to kill me. I won't forget" -->
  <g id="burbridge-threatening" transform="translate(420, 95)">
    <use href="#burbridge-body"/>
    <g transform="translate(0, -52)">
      <use href="#burbridge-head-base"/>
      <!-- Narrowed menacing eyes -->
      <ellipse cx="-7" cy="-10" rx="3.5" ry="1.8" fill="#e8d060" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-10" rx="3.5" ry="1.8" fill="#e8d060" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10" r="1.5" fill="#111"/>
      <circle cx="10" cy="-10" r="1.5" fill="#111"/>
      <!-- Hard V brows -->
      <line x1="-12" y1="-17" x2="-4" y2="-14" stroke="#8a7a60" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="-14" x2="12" y2="-17" stroke="#8a7a60" stroke-width="2" stroke-linecap="round"/>
      <!-- Snarling teeth -->
      <path d="M-5,5 Q0,8 5,5" fill="white" stroke="#222" stroke-width="1.3"/>
      <line x1="-2" y1="5" x2="-2" y2="8" stroke="#222" stroke-width="0.8"/>
      <line x1="2" y1="5" x2="2" y2="8" stroke="#222" stroke-width="0.8"/>
    </g>
    <text x="0" y="95" class="label">threatening</text>
    <text x="0" y="106" class="sublabel">"won't forget"</text>
  </g>

  <!-- 5. RESIGNED — accepting amputation -->
  <g id="burbridge-resigned" transform="translate(540, 95)">
    <use href="#burbridge-body"/>
    <g transform="translate(0, -52)">
      <use href="#burbridge-head-base"/>
      <!-- Dull half-closed eyes -->
      <path d="M-10,-10 Q-7,-8 -4,-10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <path d="M6,-10 Q9,-8 12,-10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <!-- Visible yellow beneath -->
      <ellipse cx="-7" cy="-9.5" rx="2" ry="1" fill="#e8d060" opacity="0.5"/>
      <ellipse cx="9" cy="-9.5" rx="2" ry="1" fill="#e8d060" opacity="0.5"/>
      <!-- Sagging brows -->
      <line x1="-12" y1="-14" x2="-4" y2="-15" stroke="#8a7a60" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="4" y1="-15" x2="12" y2="-14" stroke="#8a7a60" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Bitter flat mouth -->
      <path d="M-4,6 Q0,5 4,6" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="95" class="label">resigned</text>
    <text x="0" y="106" class="sublabel">accepting, bitter</text>
  </g>
</svg>
