<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <!-- ARTHUR BURBRIDGE — Character Sheet
       9 data-driven expressions from book inventory (Ch4 only, dies)
       Key identifiers: dark raven hair, thin mustache, leather jacket, handsome/chiseled, young
       "Pretty Boy Artie" — broad-shouldered, narrow-hipped -->
  <style>
    text { font-family: 'Courier New', monospace; }
    .label { font-size: 11px; font-weight: bold; text-anchor: middle; fill: #333; }
    .sublabel { font-size: 9px; text-anchor: middle; fill: #888; }
  </style>

  <defs>
    <g id="arthur-body">
      <!-- Leather jacket — broader shoulders, narrower hips -->
      <path d="M-28,0 L-22,-5 L22,-5 L28,0 L25,50 L-25,50 Z" fill="#4a3628" stroke="#222" stroke-width="2"/>
      <!-- Jacket collar -->
      <path d="M-12,-5 L-5,8 L0,5 L5,8 L12,-5" fill="none" stroke="#222" stroke-width="1.5"/>
      <!-- Zipper line -->
      <line x1="0" y1="5" x2="0" y2="50" stroke="#777" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- Arms -->
      <line x1="-28" y1="8" x2="-36" y2="42" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="28" y1="8" x2="36" y2="42" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Hands -->
      <circle cx="-36" cy="44" r="4.5" fill="#e0b898" stroke="#222" stroke-width="1.5"/>
      <circle cx="36" cy="44" r="4.5" fill="#e0b898" stroke="#222" stroke-width="1.5"/>
      <!-- Legs — narrower stance -->
      <line x1="-8" y1="50" x2="-9" y2="82" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="8" y1="50" x2="9" y2="82" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Shoes -->
      <ellipse cx="-11" cy="85" rx="9" ry="4.5" fill="#444" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="11" cy="85" rx="9" ry="4.5" fill="#444" stroke="#222" stroke-width="1.5"/>
    </g>

    <g id="arthur-hair">
      <!-- Dark raven hair, bouncy, fuller than Red's -->
      <path d="M-20,-18 Q-16,-33 -8,-30 Q-2,-37 5,-32 Q12,-37 18,-30 Q22,-33 24,-18" fill="#1a1a2e" stroke="#111" stroke-width="1.5"/>
      <!-- Side hair -->
      <path d="M-22,-12 Q-25,-18 -20,-18" fill="#1a1a2e" stroke="#111" stroke-width="1"/>
      <path d="M24,-12 Q27,-18 24,-18" fill="#1a1a2e" stroke="#111" stroke-width="1"/>
    </g>

    <g id="arthur-head-base">
      <!-- Slightly narrower/more angular face than Red — chiseled -->
      <ellipse cx="0" cy="-6" rx="20" ry="22" fill="#e0b898" stroke="#222" stroke-width="2"/>
      <use href="#arthur-hair"/>
      <!-- Nose — straighter, more defined -->
      <path d="M-1,-4 L0,3 L4,2" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Thin mustache -->
      <path d="M-6,5 Q-3,7 0,6 Q3,7 6,5" fill="none" stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <text x="450" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#222" font-family="'Courier New', monospace">ARTHUR BURBRIDGE — 9 Expressions (Ch4 Only)</text>

  <!-- ROW 1: 5 expressions -->

  <!-- 1. EAGER — striding merrily, start of expedition -->
  <g id="arthur-eager" transform="translate(80, 110)">
    <use href="#arthur-body"/>
    <g transform="translate(0, -55)">
      <use href="#arthur-head-base"/>
      <!-- Bright open eyes -->
      <ellipse cx="-6" cy="-9" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-9" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-5" cy="-9" r="2" fill="#3a2a1a"/>
      <circle cx="9" cy="-9" r="2" fill="#3a2a1a"/>
      <!-- Raised cheerful brows -->
      <line x1="-12" y1="-16" x2="-3" y2="-14" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-14" x2="14" y2="-16" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Happy smile -->
      <path d="M-6,7 Q1,12 8,7" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="0" y="105" class="label">eager</text>
    <text x="0" y="116" class="sublabel">striding, merry</text>
  </g>

  <!-- 2. HURT/PROUD — refusing drink "I don't need that for courage" -->
  <g id="arthur-hurt" transform="translate(240, 110)">
    <use href="#arthur-body"/>
    <g transform="translate(0, -55)">
      <use href="#arthur-head-base"/>
      <!-- Direct steady eyes -->
      <ellipse cx="-6" cy="-9" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-9" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-9" r="1.8" fill="#3a2a1a"/>
      <circle cx="8" cy="-9" r="1.8" fill="#3a2a1a"/>
      <!-- Slightly furrowed brows — wounded dignity -->
      <line x1="-12" y1="-14" x2="-3" y2="-13" stroke="#1a1a2e" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="5" y1="-13" x2="14" y2="-14" stroke="#1a1a2e" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Tight proud mouth -->
      <line x1="-5" y1="8" x2="7" y2="8" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="0" y="105" class="label">hurt</text>
    <text x="0" y="116" class="sublabel">proud, dignified</text>
  </g>

  <!-- 3. EMBARRASSED/BLUSHING — asked about his wish -->
  <g id="arthur-embarrassed" transform="translate(400, 110)">
    <use href="#arthur-body"/>
    <g transform="translate(0, -55)">
      <use href="#arthur-head-base"/>
      <!-- Averted eyes, looking down-right -->
      <ellipse cx="-6" cy="-9" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-9" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-4" cy="-8" r="1.8" fill="#3a2a1a"/>
      <circle cx="10" cy="-8" r="1.8" fill="#3a2a1a"/>
      <!-- Raised uncertain brows -->
      <line x1="-12" y1="-16" x2="-3" y2="-14" stroke="#1a1a2e" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="5" y1="-14" x2="14" y2="-16" stroke="#1a1a2e" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Awkward small smile -->
      <path d="M-3,8 Q2,10 7,8" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Blush marks -->
      <ellipse cx="-10" cy="-2" rx="4" ry="2" fill="#d88" opacity="0.4"/>
      <ellipse cx="12" cy="-2" rx="4" ry="2" fill="#d88" opacity="0.4"/>
    </g>
    <text x="0" y="105" class="label">embarrassed</text>
    <text x="0" y="116" class="sublabel">blushing, averted</text>
  </g>

  <!-- 4. SCARED/TERRIFIED — heat blast, depression crossing -->
  <g id="arthur-scared" transform="translate(560, 110)">
    <use href="#arthur-body"/>
    <g transform="translate(0, -55)">
      <use href="#arthur-head-base"/>
      <!-- Wide terrified eyes -->
      <ellipse cx="-6" cy="-9" rx="4.5" ry="4" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-9" rx="4.5" ry="4" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-8.5" r="2.2" fill="#3a2a1a"/>
      <circle cx="8" cy="-8.5" r="2.2" fill="#3a2a1a"/>
      <!-- High strained brows -->
      <line x1="-13" y1="-18" x2="-3" y2="-15" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="-15" x2="15" y2="-18" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
      <!-- Open screaming mouth -->
      <ellipse cx="1" cy="9" rx="6" ry="4" fill="#411" stroke="#222" stroke-width="1.5"/>
      <!-- Sweat -->
      <path d="M-17,-3 L-19,1 L-15,1 Z" fill="#6bf" opacity="0.6"/>
      <path d="M19,-5 L17,-1 L21,-1 Z" fill="#6bf" opacity="0.5"/>
    </g>
    <text x="0" y="105" class="label">scared</text>
    <text x="0" y="116" class="sublabel">terrified, screaming</text>
  </g>

  <!-- 5. GRATEFUL — "You saved my life!" -->
  <g id="arthur-grateful" transform="translate(720, 110)">
    <use href="#arthur-body"/>
    <g transform="translate(0, -55)">
      <use href="#arthur-head-base"/>
      <!-- Soft wide eyes with shine -->
      <ellipse cx="-6" cy="-9" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-9" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-9" r="2" fill="#3a2a1a"/>
      <circle cx="8" cy="-9" r="2" fill="#3a2a1a"/>
      <circle cx="-4" cy="-10" r="0.7" fill="white"/>
      <circle cx="10" cy="-10" r="0.7" fill="white"/>
      <!-- Raised thankful brows -->
      <line x1="-12" y1="-17" x2="-3" y2="-14" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-14" x2="14" y2="-17" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Open grateful smile -->
      <path d="M-5,7 Q1,12 7,7" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="0" y="105" class="label">grateful</text>
    <text x="0" y="116" class="sublabel">thankful, shining</text>
  </g>

  <!-- ROW 2: 4 expressions -->

  <!-- 6. AWED — seeing Zone's green dawn -->
  <g id="arthur-awed" transform="translate(80, 280)">
    <use href="#arthur-body"/>
    <g transform="translate(0, -55)">
      <use href="#arthur-head-base"/>
      <!-- Wide wonder eyes -->
      <ellipse cx="-6" cy="-9" rx="4" ry="3.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-9" rx="4" ry="3.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-9" r="2" fill="#3a2a1a"/>
      <circle cx="8" cy="-9" r="2" fill="#3a2a1a"/>
      <!-- High rounded brows -->
      <path d="M-12,-16 Q-7,-19 -3,-15" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M5,-15 Q9,-19 14,-16" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Small "O" mouth -->
      <ellipse cx="1" cy="9" rx="3.5" ry="3" fill="#522" stroke="#222" stroke-width="1.5"/>
    </g>
    <text x="0" y="105" class="label">awed</text>
    <text x="0" y="116" class="sublabel">wonder, gasping</text>
  </g>

  <!-- 7. DREAMY/HOPEFUL — asking about the Golden Ball -->
  <g id="arthur-dreamy" transform="translate(320, 280)">
    <use href="#arthur-body"/>
    <g transform="translate(0, -55)">
      <use href="#arthur-head-base"/>
      <!-- Soft upward-looking eyes -->
      <ellipse cx="-6" cy="-9" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-9" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-10.5" r="1.8" fill="#3a2a1a"/>
      <circle cx="8" cy="-10.5" r="1.8" fill="#3a2a1a"/>
      <!-- Relaxed slightly raised brows -->
      <line x1="-12" y1="-16" x2="-3" y2="-15" stroke="#1a1a2e" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="5" y1="-15" x2="14" y2="-16" stroke="#1a1a2e" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Gentle wistful smile -->
      <path d="M-4,7 Q2,10 8,7" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="105" class="label">dreamy</text>
    <text x="0" y="116" class="sublabel">hopeful, wistful</text>
  </g>

  <!-- 8. SAD/SERIOUS — "one bullet, in case of an accident like Father's" -->
  <g id="arthur-sad" transform="translate(560, 280)">
    <use href="#arthur-body"/>
    <g transform="translate(0, -55)">
      <use href="#arthur-head-base"/>
      <!-- Downcast eyes -->
      <ellipse cx="-6" cy="-9" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-9" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-8" r="1.8" fill="#3a2a1a"/>
      <circle cx="8" cy="-8" r="1.8" fill="#3a2a1a"/>
      <!-- Slightly furrowed, sad brows -->
      <line x1="-12" y1="-14" x2="-3" y2="-15" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="-15" x2="14" y2="-14" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Downturned mouth -->
      <path d="M-5,9 Q1,6 7,9" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="0" y="105" class="label">sad</text>
    <text x="0" y="116" class="sublabel">serious, grave</text>
  </g>

  <!-- 9. JOYFUL/ECSTATIC — "HAPPINESS FOR EVERYBODY! FREE!" -->
  <g id="arthur-joyful" transform="translate(800, 280)">
    <use href="#arthur-body"/>
    <g transform="translate(0, -55)">
      <use href="#arthur-head-base"/>
      <!-- Bright wide ecstatic eyes -->
      <ellipse cx="-6" cy="-9" rx="4" ry="3.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="8" cy="-9" rx="4" ry="3.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-6" cy="-9" r="2.2" fill="#3a2a1a"/>
      <circle cx="8" cy="-9" r="2.2" fill="#3a2a1a"/>
      <circle cx="-4" cy="-10" r="0.8" fill="white"/>
      <circle cx="10" cy="-10" r="0.8" fill="white"/>
      <!-- High arched joyful brows -->
      <path d="M-12,-17 Q-7,-20 -3,-16" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M5,-16 Q9,-20 14,-17" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Wide open joyful mouth -->
      <path d="M-8,6 Q1,15 10,6" fill="#522" stroke="#222" stroke-width="1.5"/>
      <!-- Teeth showing (happy) -->
      <line x1="-4" y1="8" x2="-4" y2="10" stroke="white" stroke-width="1.5"/>
      <line x1="0" y1="8" x2="0" y2="10" stroke="white" stroke-width="1.5"/>
      <line x1="4" y1="8" x2="4" y2="10" stroke="white" stroke-width="1.5"/>
    </g>
    <text x="0" y="105" class="label">joyful</text>
    <text x="0" y="116" class="sublabel">ecstatic, shouting</text>
  </g>
</svg>
