<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
  <!-- KIRILL PANOV — Character Sheet
       5 data-driven expressions (Ch1 only — dies in the Zone)
       Key identifiers: glasses, thin, gray face, "sick-dog eyes", lab coat/blue jacket, Russian
       His last expression is ecstatic/radiant — finding the full empty -->
  <style>
    text { font-family: 'Courier New', monospace; }
    .label { font-size: 11px; font-weight: bold; text-anchor: middle; fill: #333; }
    .sublabel { font-size: 9px; text-anchor: middle; fill: #888; }
  </style>

  <defs>
    <g id="kirill-body">
      <!-- Thin torso — lab coat over blue -->
      <rect x="-14" y="-2" width="28" height="48" rx="4" fill="#ddd" stroke="#222" stroke-width="2"/>
      <!-- Blue shirt underneath -->
      <rect x="-8" y="-2" width="16" height="20" fill="#4466aa" stroke="none"/>
      <!-- Lab coat lapels -->
      <path d="M-14,-2 L-6,12" stroke="#bbb" stroke-width="1.5"/>
      <path d="M14,-2 L6,12" stroke="#bbb" stroke-width="1.5"/>
      <!-- Thin arms -->
      <line x1="-14" y1="8" x2="-20" y2="38" stroke="#222" stroke-width="3" stroke-linecap="round"/>
      <line x1="14" y1="8" x2="20" y2="38" stroke="#222" stroke-width="3" stroke-linecap="round"/>
      <!-- Hands -->
      <circle cx="-20" cy="40" r="4" fill="#c8a890" stroke="#222" stroke-width="1.2"/>
      <circle cx="20" cy="40" r="4" fill="#c8a890" stroke="#222" stroke-width="1.2"/>
      <!-- Thin legs -->
      <line x1="-6" y1="46" x2="-6" y2="72" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <line x1="6" y1="46" x2="6" y2="72" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <!-- Shoes -->
      <ellipse cx="-8" cy="74" rx="7" ry="3.5" fill="#444" stroke="#222" stroke-width="1.2"/>
      <ellipse cx="8" cy="74" rx="7" ry="3.5" fill="#444" stroke="#222" stroke-width="1.2"/>
    </g>

    <g id="kirill-head-base">
      <!-- Grayish skin ("gray face") -->
      <ellipse cx="0" cy="-8" rx="17" ry="20" fill="#c8b8a8" stroke="#222" stroke-width="2"/>
      <!-- Glasses (KEY identifier) — round wire frames -->
      <circle cx="-7" cy="-10" r="6" fill="none" stroke="#444" stroke-width="1.8"/>
      <circle cx="9" cy="-10" r="6" fill="none" stroke="#444" stroke-width="1.8"/>
      <line x1="-1" y1="-10" x2="3" y2="-10" stroke="#444" stroke-width="1.5"/>
      <line x1="-13" y1="-10" x2="-16" y2="-12" stroke="#444" stroke-width="1.2"/>
      <line x1="15" y1="-10" x2="18" y2="-12" stroke="#444" stroke-width="1.2"/>
      <!-- Thin brown hair, a bit unkempt -->
      <path d="M-14,-22 Q-8,-28 0,-26 Q8,-28 14,-22 Q16,-16 14,-14 L-14,-14 Q-16,-16 -14,-22 Z"
            fill="#6a4a2a" stroke="#5a3a1a" stroke-width="1.2"/>
      <!-- Small nose -->
      <line x1="1" y1="-5" x2="0" y2="0" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <text x="300" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#222" font-family="'Courier New', monospace">KIRILL PANOV — 5 Expressions (Ch1 only, dies)</text>

  <!-- 1. WORN OUT/GRAY — arriving at repository -->
  <g id="kirill-worn" transform="translate(60, 95)">
    <use href="#kirill-body"/>
    <g transform="translate(0, -52)">
      <use href="#kirill-head-base"/>
      <!-- Tired droopy eyes ("sick-dog eyes") -->
      <path d="M-10,-10 Q-7,-8 -4,-10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <path d="M6,-10 Q9,-8 12,-10" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-7" cy="-9" r="1" fill="#3a3a2a"/>
      <circle cx="9" cy="-9" r="1" fill="#3a3a2a"/>
      <!-- Flat tired brows -->
      <line x1="-12" y1="-16" x2="-4" y2="-16" stroke="#6a4a2a" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="4" y1="-16" x2="12" y2="-16" stroke="#6a4a2a" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Flat mouth -->
      <line x1="-4" y1="4" x2="4" y2="4" stroke="#222" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <text x="0" y="95" class="label">worn out</text>
    <text x="0" y="106" class="sublabel">gray, sick-dog eyes</text>
  </g>

  <!-- 2. PUZZLED — about the full empty -->
  <g id="kirill-puzzled" transform="translate(180, 95)">
    <use href="#kirill-body"/>
    <g transform="translate(0, -52)">
      <use href="#kirill-head-base"/>
      <!-- One eye slightly squinting, one wider -->
      <ellipse cx="-7" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-10" rx="2.5" ry="2" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-10" r="1.5" fill="#3a3a2a"/>
      <circle cx="9" cy="-10" r="1.5" fill="#3a3a2a"/>
      <!-- One brow up, one flat -->
      <path d="M-12,-16 Q-8,-19 -4,-16" fill="none" stroke="#6a4a2a" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="4" y1="-16" x2="12" y2="-16" stroke="#6a4a2a" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Slight frown -->
      <path d="M-3,4 Q0,3 3,4" fill="none" stroke="#222" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <text x="0" y="95" class="label">puzzled</text>
    <text x="0" y="106" class="sublabel">head tilt, squinting</text>
  </g>

  <!-- 3. EXCITED/BRIGHT-EYED — eager for Zone -->
  <g id="kirill-excited" transform="translate(300, 95)">
    <use href="#kirill-body"/>
    <g transform="translate(0, -52)">
      <use href="#kirill-head-base"/>
      <!-- Wide bright eyes -->
      <ellipse cx="-7" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-10" rx="3.5" ry="3" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-10" r="2" fill="#3a3a2a"/>
      <circle cx="9" cy="-10" r="2" fill="#3a3a2a"/>
      <circle cx="-6" cy="-11" r="0.7" fill="white"/>
      <circle cx="10" cy="-11" r="0.7" fill="white"/>
      <!-- Raised animated brows -->
      <line x1="-12" y1="-18" x2="-4" y2="-16" stroke="#6a4a2a" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="4" y1="-16" x2="12" y2="-18" stroke="#6a4a2a" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Open grin -->
      <path d="M-4,3 Q0,8 4,3" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="95" class="label">excited</text>
    <text x="0" y="106" class="sublabel">bright-eyed, eager</text>
  </g>

  <!-- 4. BRAVE/CALM — in the Zone -->
  <g id="kirill-brave" transform="translate(420, 95)">
    <use href="#kirill-body"/>
    <g transform="translate(0, -52)">
      <use href="#kirill-head-base"/>
      <!-- Steady focused eyes -->
      <ellipse cx="-7" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-10" rx="3" ry="2.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-10" r="1.8" fill="#3a3a2a"/>
      <circle cx="9" cy="-10" r="1.8" fill="#3a3a2a"/>
      <!-- Level determined brows -->
      <line x1="-12" y1="-16" x2="-4" y2="-15" stroke="#6a4a2a" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="-15" x2="12" y2="-16" stroke="#6a4a2a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Firm set mouth -->
      <line x1="-3" y1="4" x2="3" y2="4" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="95" class="label">brave</text>
    <text x="0" y="106" class="sublabel">calm, determined</text>
  </g>

  <!-- 5. ECSTATIC/RADIANT — finding the full empty (his LAST expression) -->
  <g id="kirill-ecstatic" transform="translate(540, 95)">
    <use href="#kirill-body"/>
    <g transform="translate(0, -52)">
      <use href="#kirill-head-base"/>
      <!-- Shining wide eyes — light reflections -->
      <ellipse cx="-7" cy="-10" rx="4" ry="3.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <ellipse cx="9" cy="-10" rx="4" ry="3.5" fill="white" stroke="#222" stroke-width="1.5"/>
      <circle cx="-7" cy="-10" r="2" fill="#3a3a2a"/>
      <circle cx="9" cy="-10" r="2" fill="#3a3a2a"/>
      <circle cx="-6" cy="-11" r="1" fill="white"/>
      <circle cx="10" cy="-11" r="1" fill="white"/>
      <!-- High arched joyful brows -->
      <path d="M-12,-18 Q-8,-21 -4,-17" fill="none" stroke="#6a4a2a" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M4,-17 Q8,-21 12,-18" fill="none" stroke="#6a4a2a" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Wide ecstatic smile -->
      <path d="M-5,3 Q0,9 5,3" fill="#833" stroke="#222" stroke-width="1.3"/>
      <!-- Radiance lines -->
      <line x1="-18" y1="-18" x2="-22" y2="-22" stroke="#fc6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="18" y1="-18" x2="22" y2="-22" stroke="#fc6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="0" y1="-28" x2="0" y2="-32" stroke="#fc6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>
    <text x="0" y="95" class="label">ecstatic</text>
    <text x="0" y="106" class="sublabel">radiant — last moment</text>
  </g>
</svg>
