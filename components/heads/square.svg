    <rect x="62" y="18" width="76" height="82" rx="12" fill="var(--skin, #e8c39e)"/>
    <!-- Ears -->
    <ellipse cx="60" cy="60" rx="7" ry="12" fill="var(--skin, #e8c39e)"/>
    <ellipse cx="140" cy="60" rx="7" ry="12" fill="var(--skin, #e8c39e)"/>
  </g>
</svg>
