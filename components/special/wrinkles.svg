    <!-- Crow's feet (right eye) -->
    <path d="M132,52 L136,48 M132,55 L136,55 M132,58 L136,62"/>
    <!-- Nasolabial folds -->
    <path d="M88,68 Q86,74 88,80"/>
    <path d="M112,68 Q114,74 112,80"/>
