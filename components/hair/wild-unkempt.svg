<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Wild/unkempt hair: big, messy, spiky in all directions -->
  <g id="hair-wild-unkempt" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round">
    <!-- Main hair mass -->
    <path d="M44,55 Q38,30 55,10 L48,4 Q60,12 70,0 L75,6 Q85,-6 100,-4
      Q115,-6 125,6 L130,0 Q140,12 152,4 L145,10 Q162,30 156,55
      Q156,14 100,8 Q44,14 44,55 Z" fill="var(--hair, #4a3728)"/>
    <!-- Wild tufts sticking out -->
    <path d="M42,48 L32,35 Q38,45 42,52" fill="var(--hair, #4a3728)"/>
    <path d="M158,48 L168,35 Q162,45 158,52" fill="var(--hair, #4a3728)"/>
    <path d="M50,35 L38,22 Q46,30 52,38" fill="var(--hair, #4a3728)"/>
    <path d="M150,35 L162,22 Q154,30 148,38" fill="var(--hair, #4a3728)"/>
    <!-- Extra spikes on top -->
    <path d="M80,2 L76,-10 Q82,0 84,4" fill="var(--hair, #4a3728)"/>
    <path d="M100,-4 L98,-16 Q102,-6 104,-2" fill="var(--hair, #4a3728)"/>
    <path d="M120,2 L124,-10 Q118,0 116,4" fill="var(--hair, #4a3728)"/>
    <!-- Side hair falling messy -->
    <path d="M44,55 Q40,65 42,80 Q38,75 40,60" fill="var(--hair, #4a3728)"/>
    <path d="M156,55 Q160,65 158,80 Q162,75 160,60" fill="var(--hair, #4a3728)"/>
  </g>
</svg>
