<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Ponytail: hair pulled back, tail hanging behind/to side -->
  <g id="hair-female-ponytail" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round">
    <!-- Top pulled back -->
    <path d="M62,48 Q60,14 100,10 Q140,14 138,48 L140,40 Q140,6 100,4 Q60,6 60,40 Z" fill="var(--hair, #4a3728)"/>
    <!-- Ponytail coming from back of head -->
    <path d="M130,35 Q142,38 148,50 Q154,65 150,90 Q148,105 142,110 Q138,108 140,90 Q142,70 138,55 Q134,42 128,38 Z" fill="var(--hair, #4a3728)"/>
    <!-- Hair tie bump -->
    <circle cx="138" cy="40" r="5" fill="var(--hair, #4a3728)" stroke-width="2"/>
    <!-- Side hair -->
    <path d="M60,40 Q58,50 58,62" fill="var(--hair, #4a3728)" stroke-width="2"/>
  </g>
</svg>
