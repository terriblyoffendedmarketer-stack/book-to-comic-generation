<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Stubble: dot pattern on jaw/chin area -->
  <g id="facial-hair-stubble" fill="var(--hair, #4a3728)" stroke="none" opacity="0.4">
    <!-- Jaw dots -->
    <circle cx="78" cy="78" r="1"/>  <circle cx="82" cy="82" r="1"/>
    <circle cx="86" cy="84" r="1"/>  <circle cx="90" cy="82" r="1"/>
    <circle cx="94" cy="86" r="1"/>  <circle cx="98" cy="84" r="1"/>
    <circle cx="102" cy="86" r="1"/> <circle cx="106" cy="82" r="1"/>
    <circle cx="110" cy="84" r="1"/> <circle cx="114" cy="82" r="1"/>
    <circle cx="118" cy="82" r="1"/> <circle cx="122" cy="78" r="1"/>
    <!-- Chin -->
    <circle cx="96" cy="90" r="1"/>  <circle cx="100" cy="92" r="1"/>
    <circle cx="104" cy="90" r="1"/> <circle cx="100" cy="88" r="1"/>
    <!-- Cheek area -->
    <circle cx="74" cy="72" r="1"/>  <circle cx="126" cy="72" r="1"/>
    <circle cx="76" cy="76" r="1"/>  <circle cx="124" cy="76" r="1"/>
  </g>
</svg>
