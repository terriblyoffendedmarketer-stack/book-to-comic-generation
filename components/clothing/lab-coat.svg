<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Lab coat: white coat over clothing, extends to knees -->
  <g id="clothing-lab-coat" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round">
    <!-- Coat body (extends past normal torso) -->
    <path d="M54,120 L54,300 Q54,305 64,305 L92,305 L92,120 Z" fill="white"/>
    <path d="M146,120 L146,300 Q146,305 136,305 L108,305 L108,120 Z" fill="white"/>
    <!-- Collar -->
    <path d="M78,115 L86,130 L92,120 L100,122 L108,120 L114,130 L122,115" fill="white"/>
    <!-- Inner shirt/clothing visible -->
    <rect x="92" y="120" width="16" height="185" fill="var(--clothing-secondary, #4a90d9)"/>
    <!-- Pockets -->
    <rect x="62" y="200" width="22" height="28" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="118" y="200" width="22" height="28" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Sleeves -->
    <path d="M54,125 L36,132 Q26,136 24,146 L18,215 Q16,222 22,222 L34,222 Q40,220 42,212 L52,155 Z" fill="white"/>
    <path d="M146,125 L164,132 Q174,136 176,146 L182,215 Q184,222 178,222 L166,222 Q160,220 158,212 L148,155 Z" fill="white"/>
  </g>
</svg>
