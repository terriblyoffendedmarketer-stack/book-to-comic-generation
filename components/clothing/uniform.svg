<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Military/police uniform: buttoned up, epaulettes, badges -->
  <g id="clothing-uniform" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round">
    <!-- Uniform body -->
    <path d="M58,120 L58,258 Q58,265 68,265 L132,265 Q142,265 142,258 L142,120 Z" fill="var(--clothing-primary, #556B2F)"/>
    <!-- Button line -->
    <line x1="100" y1="122" x2="100" y2="262" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="100" cy="140" r="2.5" fill="#C0A000"/>
    <circle cx="100" cy="165" r="2.5" fill="#C0A000"/>
    <circle cx="100" cy="190" r="2.5" fill="#C0A000"/>
    <circle cx="100" cy="215" r="2.5" fill="#C0A000"/>
    <!-- Collar (stiff, high) -->
    <path d="M82,112 L88,122 L100,118 L112,122 L118,112" fill="var(--clothing-primary, #556B2F)"/>
    <!-- Epaulettes -->
    <rect x="56" y="118" width="14" height="6" rx="2" fill="var(--clothing-primary, #556B2F)" stroke-width="2"/>
    <rect x="130" y="118" width="14" height="6" rx="2" fill="var(--clothing-primary, #556B2F)" stroke-width="2"/>
    <!-- Breast pocket -->
    <rect x="106" y="132" width="18" height="14" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Sleeves -->
    <path d="M58,125 L40,132 Q30,136 28,146 L22,212 Q20,220 26,220 L38,220 Q44,218 46,210 L56,155 Z" fill="var(--clothing-primary, #556B2F)"/>
    <path d="M142,125 L160,132 Q170,136 172,146 L178,212 Q180,220 174,220 L162,220 Q156,218 154,210 L144,155 Z" fill="var(--clothing-primary, #556B2F)"/>
  </g>
</svg>
