<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Sweater: crew neck, long sleeves, comfortable -->
  <g id="clothing-sweater" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round">
    <!-- Sweater body -->
    <path d="M60,120 L60,258 Q60,265 70,265 L130,265 Q140,265 140,258 L140,120 Z" fill="var(--clothing-primary, #8B4513)"/>
    <!-- Crew neck ribbing -->
    <path d="M84,115 Q100,120 116,115 Q100,118 84,115 Z" fill="var(--clothing-primary, #8B4513)" stroke-width="3"/>
    <!-- Waist ribbing -->
    <rect x="60" y="255" width="80" height="10" rx="2" fill="var(--clothing-primary, #8B4513)" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Long sleeves -->
    <path d="M60,125 L40,132 Q30,136 28,146 L22,212 Q20,220 26,220 L38,220 Q44,218 46,210 L56,155 Z" fill="var(--clothing-primary, #8B4513)"/>
    <path d="M140,125 L160,132 Q170,136 172,146 L178,212 Q180,220 174,220 L162,220 Q156,218 154,210 L144,155 Z" fill="var(--clothing-primary, #8B4513)"/>
    <!-- Cuff ribbing -->
    <rect x="20" y="216" width="18" height="6" rx="2" fill="var(--clothing-primary, #8B4513)" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="162" y="216" width="18" height="6" rx="2" fill="var(--clothing-primary, #8B4513)" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
</svg>
