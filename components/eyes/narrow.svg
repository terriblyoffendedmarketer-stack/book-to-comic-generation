<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Narrow eyes: small, sharp, calculating look -->
  <g id="eyes-narrow" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round">
    <!-- Left eye -->
    <ellipse cx="82" cy="56" rx="8" ry="5" fill="white"/>
    <circle cx="83" cy="56" r="3" fill="var(--eye-color, #5a3e28)"/>
    <circle cx="84" cy="55.5" r="1.5" fill="#1a1a1a"/>
    <!-- Right eye -->
    <ellipse cx="118" cy="56" rx="8" ry="5" fill="white"/>
    <circle cx="117" cy="56" r="3" fill="var(--eye-color, #5a3e28)"/>
    <circle cx="116" cy="55.5" r="1.5" fill="#1a1a1a"/>
  </g>
</svg>
