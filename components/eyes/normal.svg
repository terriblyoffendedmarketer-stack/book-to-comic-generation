<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400">
  <!-- Normal eyes: standard oval with iris and pupil -->
  <g id="eyes-normal" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round">
    <!-- Left eye -->
    <ellipse cx="82" cy="55" rx="10" ry="7" fill="white"/>
    <circle cx="84" cy="55" r="4" fill="var(--eye-color, #5a3e28)"/>
    <circle cx="85" cy="54" r="1.5" fill="#1a1a1a"/>
    <!-- Right eye -->
    <ellipse cx="118" cy="55" rx="10" ry="7" fill="white"/>
    <circle cx="116" cy="55" r="4" fill="var(--eye-color, #5a3e28)"/>
    <circle cx="115" cy="54" r="1.5" fill="#1a1a1a"/>
  </g>
</svg>
