<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comic Page — TEMPLATE</title>
<!--
  page-template.html — Starter template for a comic page
  Usage: Copy this file, rename to page-XX.html, fill in panels

  Panel layout options:
    .panel-wide   = 2/3 width (use with .panel-narrow)
    .panel-narrow = 1/3 width (use with .panel-wide)
    .panel-full   = full width (use alone in a row)

  Row heights: 120-260px depending on content density

  Speech bubble classes:
    .bubble        = speech, tail bottom-left
    .bubble.right  = speech, tail bottom-right
    .bubble.thought = thought bubble with cloud dots
    .narrator      = yellow narration box (no tail)
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f0e8;
    display: flex;
    justify-content: center;
    padding: 20px;
    font-family: 'Patrick Hand', cursive;
  }
  .page {
    width: 700px;
    background: white;
    border: 3px solid #222;
    padding: 12px;
    display: grid;
    gap: 8px;
  }
  .panel-row { display: flex; gap: 8px; }
  .panel {
    border: 2.5px solid #222;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    background: #fff;
  }
  .panel-wide { flex: 2; }
  .panel-narrow { flex: 1; }
  .panel-full { flex: 1; }
  .panel-inner { width: 100%; height: 100%; position: relative; }
  .bubble {
    position: absolute;
    background: white;
    border: 2px solid #222;
    border-radius: 18px;
    padding: 6px 10px;
    font-size: 13px;
    line-height: 1.3;
    max-width: 180px;
    z-index: 10;
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -12px; left: 25px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid white;
  }
  .bubble::before {
    content: '';
    position: absolute;
    bottom: -15px; left: 24px;
    width: 0; height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 14px solid #222;
  }
  .bubble.right::after { left: auto; right: 25px; }
  .bubble.right::before { left: auto; right: 24px; }
  .bubble.thought { border-radius: 20px; }
  .bubble.thought::after {
    border: none; width: 8px; height: 8px;
    background: white; border-radius: 50%;
    bottom: -10px; border: 2px solid #222;
  }
  .bubble.thought::before {
    border: none; width: 5px; height: 5px;
    background: white; border-radius: 50%;
    bottom: -18px; left: 30px; border: 2px solid #222;
  }
  .narrator {
    position: absolute;
    background: #f8f0d0;
    border: 2px solid #222;
    padding: 5px 8px;
    font-size: 12px;
    line-height: 1.3;
    z-index: 10;
    max-width: 200px;
  }
  .caption {
    font-family: 'Bangers', cursive;
    font-size: 11px;
    letter-spacing: 1px;
    color: #666;
    text-align: center;
    padding: 2px 0;
  }
  .bold { font-weight: bold; }
  .italic { font-style: italic; }
</style>
</head>
<body>
<div class="page">

  <div class="caption">SCENE CAPTION HERE</div>

  <!-- ROW 1: Example wide + narrow -->
  <div class="panel-row" style="height: 180px;">
    <div class="panel panel-wide">
      <div class="panel-inner">
        <div class="narrator" style="top:5px;left:5px;">
          Narration text here.
        </div>
        <svg viewBox="0 0 440 180">
          <!-- Background -->
          <rect x="0" y="0" width="440" height="180" fill="#d4c8a0"/>
          <rect x="0" y="130" width="440" height="50" fill="#a09070"/>
          <!-- CHARACTER TEMPLATE: paste and adjust transform -->
          <!--
          <g transform="translate(X, Y) scale(0.7)">
            PASTE CHARACTER SVG HERE
          </g>
          -->
        </svg>
      </div>
    </div>
    <div class="panel panel-narrow">
      <div class="panel-inner">
        <div class="bubble" style="top:5px;left:8px;">
          Dialogue here.
        </div>
        <svg viewBox="0 0 220 180">
          <rect x="0" y="0" width="220" height="180" fill="#c4b890"/>
          <!-- CHARACTER close-up -->
        </svg>
      </div>
    </div>
  </div>

  <!-- ROW 2: Three equal panels -->
  <div class="panel-row" style="height: 160px;">
    <div class="panel panel-narrow">
      <div class="panel-inner">
        <svg viewBox="0 0 220 160">
          <rect x="0" y="0" width="220" height="160" fill="#c4b890"/>
        </svg>
      </div>
    </div>
    <div class="panel panel-narrow">
      <div class="panel-inner">
        <svg viewBox="0 0 220 160">
          <rect x="0" y="0" width="220" height="160" fill="#b8a87a"/>
        </svg>
      </div>
    </div>
    <div class="panel panel-narrow">
      <div class="panel-inner">
        <svg viewBox="0 0 220 160">
          <rect x="0" y="0" width="220" height="160" fill="#c4b890"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- ROW 3: Full width -->
  <div class="panel-row" style="height: 200px;">
    <div class="panel panel-full">
      <div class="panel-inner">
        <svg viewBox="0 0 680 200">
          <rect x="0" y="0" width="680" height="200" fill="#aaa87a"/>
          <!-- BIG ATMOSPHERIC PANEL -->
        </svg>
      </div>
    </div>
  </div>

  <div style="text-align:center;font-family:'Bangers',cursive;font-size:14px;color:#666;padding:4px;">
    PAGE X &bull; CONTINUED...
  </div>

</div>
</body>
</html>
